name: Sync Upstream Releases

on:
  schedule:
    # 每天 UTC 02:17（北京时间 10:17）检查一次。
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror missing stable releases from upstream
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: komari-monitor/komari
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # 只镜像正式版；预发布版（如 Snapshot）不纳入定时同步。
          gh api "repos/${UPSTREAM_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            > release-tags.txt

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue

            if gh release view "$tag" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
              echo "Release ${tag} already exists; skipping."
              continue
            fi

            echo "Mirroring release ${tag}"
            metadata="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/tags/${tag}")"
            title="$(jq -r '.name // .tag_name' <<<"$metadata")"
            jq -r '.body // ""' <<<"$metadata" > release-notes.md

            rm -rf "release-assets/${tag}"
            mkdir -p "release-assets/${tag}"
            gh release download "$tag" \
              --repo "$UPSTREAM_REPOSITORY" \
              --dir "release-assets/${tag}" \
              --clobber

            gh release create "$tag" \
              --repo "$TARGET_REPOSITORY" \
              --title "$title" \
              --notes-file release-notes.md \
              "release-assets/${tag}"/*
          done < release-tags.txt